# ═══════════════════════════════════════════════════════════
# DEV PROFILE — dùng cho local development
# File này ĐƯỢC phép commit vào git (chứa giá trị dev/test)
# KHÔNG đặt credentials production ở đây
# ═══════════════════════════════════════════════════════════

# Datasource dev (SQL Server local hoặc PostgreSQL local)
spring.datasource.url=jdbc:postgresql://localhost:5432/phukienrom_dev
spring.datasource.username=postgres
spring.datasource.password=postgres

# Thymeleaf — disable cache trong dev để hot-reload
spring.thymeleaf.cache=false

# JPA — show SQL trong dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT dev secret (chỉ dùng local, không dùng production)
jwt.secret=dev-only-secret-key-at-least-256-bits-long-replace-in-prod
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Cloudinary dev (dùng tài khoản sandbox/test)
# Tạo tài khoản free tại cloudinary.com cho môi trường dev
cloudinary.cloud-name=your-dev-cloud-name
cloudinary.api-key=your-dev-api-key
cloudinary.api-secret=your-dev-api-secret

# Logging verbose hơn trong dev
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
