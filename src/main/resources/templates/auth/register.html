<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Đăng ký | PHỤ KIỆN RỞM</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-logo">
        <svg class="logo-fallback" viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <rect width="32" height="32" rx="6" fill="#e30019"/>
                <rect x="10" y="6" width="12" height="20" rx="3" fill="white" opacity=".9"/>
                <rect x="13" y="22" width="6" height="1.5" rx=".75" fill="#e30019"/>
                <circle cx="16" cy="8.5" r="1" fill="#e30019"/>
            </svg>
            <span>PHỤ KIỆN RỞM</span>
    </div>
    <div class="auth-card">
        <h2>Tạo tài khoản</h2>
        <p class="auth-sub">Mua sắm nhanh hơn, quản lý đơn hàng dễ dàng.</p>

        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" name="fullName" class="form-input" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-input" required>
            </div>
            <div class="form-group">
                <label>Số điện thoại (tuỳ chọn)</label>
                <input type="tel" name="phone" class="form-input">
            </div>
            <div class="form-group password-wrap">
                <label>Mật khẩu</label>
                <input type="password" name="password" class="form-input" required minlength="6">
            </div>
            <div class="form-group password-wrap">
                <label>Nhập lại mật khẩu</label>
                <input type="password" name="confirmPassword" class="form-input" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-press">Đăng ký</button>
        </form>

        <div class="auth-switch">
            Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập</a>
        </div>
    </div>
</div>
<script th:src="@{/js/main.v2.js}"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = this.querySelector('button[type="submit"]');
  setLoading(btn, true);
  const fullName = this.fullName.value.trim();
  const email = this.email.value.trim();
  const phone = this.phone.value.trim();
  const password = this.password.value;
  const confirm = this.confirmPassword.value;
  if (password !== confirm) {
    showToast('Mật khẩu nhập lại không khớp', 'error', 4000);
    setLoading(btn, false);
    return;
  }
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fullName, email, phone, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || 'Đăng ký thất bại');
    const auth = data.data;
    localStorage.setItem('jwt_token', auth.accessToken);
    localStorage.setItem('refresh_token', auth.refreshToken);
    localStorage.setItem('user', JSON.stringify(auth.user));
    document.cookie = `jwt=${auth.accessToken}; path=/; SameSite=Lax`;
    window.location.href = '/';
  } catch (err) {
    showToast(err.message, 'error', 4000);
  } finally {
    setLoading(btn, false);
  }
});
</script>
</body>
</html>
