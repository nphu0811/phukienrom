<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng | Phụ Kiện Rơm</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container page-shell">
    <div class="account-layout">
        <aside class="account-sidebar">
            <div class="account-nav">
                <div class="account-nav-title">Tài khoản</div>
                <a th:href="@{/account/profile}">Thông tin</a>
                <a th:href="@{/account/orders}" class="active">Đơn hàng</a>
                <a th:href="@{/account/wishlist}">Yêu thích</a>
                <a th:href="@{/account/addresses}">Địa chỉ</a>
                <a href="#" onclick="logout();return false;" class="caption">Đăng xuất</a>
            </div>
        </aside>

        <section class="account-content flex-1 minw-300">
            <h2 class="h2 mb-16">Đơn hàng của tôi</h2>
            <div th:if="${orders.isEmpty()}" class="auth-card text-center">
                <p class="h2">📦</p>
                <p class="caption mb-16">Bạn chưa có đơn hàng nào</p>
                <a th:href="@{/products}" class="btn btn-primary">Mua sắm ngay</a>
            </div>

            <div th:each="order : ${orders}" class="auth-card mb-16">
                <div class="flex-between flex-wrap gap-8">
                    <div>
                        <p class="body" th:text="'Đơn hàng #' + ${order.orderCode}"></p>
                        <p class="caption" th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></p>
                    </div>
                    <div class="text-right">
                        <span class="badge-new" th:text="${order.status}"></span>
                        <p class="body mt-8 fw-700 text-primary"
                           th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT') + '₫'}"></p>
                    </div>
                </div>
                <a th:href="@{/account/orders/{id}(id=${order.id})}" class="btn btn-outline mt-12">Xem chi tiết</a>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script th:src="@{/js/main.v2.js}"></script>
</body>
</html>
