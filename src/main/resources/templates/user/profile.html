<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản | Phụ Kiện Rởm</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container page-shell">
    <div class="account-layout">
        <aside class="account-sidebar">
            <div class="account-nav">
                <div class="account-nav-title">Tài khoản</div>
                <a th:href="@{/account/profile}" class="active">Thông tin</a>
                <a th:href="@{/account/orders}">Đơn hàng</a>
                <a th:href="@{/account/wishlist}">Yêu thích</a>
                <a th:href="@{/account/addresses}">Địa chỉ</a>
                <a href="#" onclick="logout();return false;" class="caption">Đăng xuất</a>
            </div>
        </aside>

        <section class="account-content flex-1 minw-300">
            <div class="auth-card">
                <h2 class="h2 mb-16">Thông tin tài khoản</h2>
                <div class="form-group">
                    <label>Họ và tên</label>
                    <input type="text" class="form-input" th:value="${currentUser.fullName}" id="fullName">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-input readonly" th:value="${currentUser.email}" readonly>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" class="form-input" th:value="${currentUser.phone}" id="phone" placeholder="Chưa cập nhật">
                </div>
                <div class="form-group">
                    <label>Vai trò</label>
                    <input type="text" class="form-input readonly" th:value="${currentUser.role}" readonly>
                </div>
                <button class="btn btn-primary" onclick="updateProfile()">Lưu thay đổi</button>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script th:src="@{/js/main.v2.js}"></script>
<script>
async function updateProfile() {
    showToast('Cập nhật sẽ sớm được hỗ trợ', 'success');
}
</script>
</body>
</html>
