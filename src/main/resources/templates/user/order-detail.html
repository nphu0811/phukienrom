<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết đơn hàng | Phụ Kiện Rởm</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div th:replace="~{layout :: navbar}"></div>

<main class="container page-shell maxw-760">
    <a th:href="@{/account/orders}" class="btn btn-outline mb-16">← Đơn hàng</a>

    <h2 class="h2 mb-8" th:text="'Đơn hàng #' + ${order.orderCode}"></h2>
    <p class="caption mb-24" th:text="${#temporals.format(order.createdAt,'dd/MM/yyyy HH:mm')}"></p>

    <div class="auth-card mb-16">
        <h3 class="h3 mb-12">Sản phẩm</h3>
        <div th:each="item : ${order.items}" class="order-item-row flex-between py-10 border-bottom">
            <div>
                <p class="body" th:text="${item.productName}"></p>
                <p class="caption" th:text="${item.variantInfo}"></p>
                <p class="caption" th:text="'x' + ${item.quantity}"></p>
            </div>
            <p class="body fw-700"
               th:text="${#numbers.formatDecimal(item.subtotal,0,'COMMA',0,'POINT') + '₫'}"></p>
        </div>
        <div class="text-right mt-12">
            <p class="body fs-18 fw-800 text-primary"
               th:text="'Tổng: ' + ${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT') + '₫'}"></p>
        </div>
    </div>

    <div class="auth-card">
        <h3 class="h3 mb-12">Thông tin giao hàng</h3>
        <p class="caption" th:text="${order.shippingAddress}"></p>
        <p class="body mt-12">Trạng thái: 
            <strong th:switch="${order.status.name()}">
                <span th:case="'PENDING'">Chờ xử lý</span>
                <span th:case="'PROCESSING'">Đã xác nhận</span>
                <span th:case="'SHIPPING'">Đang giao</span>
                <span th:case="'COMPLETED'">Hoàn thành</span>
                <span th:case="'CANCELLED'">Đã hủy</span>
                <span th:case="'RETURNED'">Đã trả hàng</span>
                <span th:case="*" th:text="${order.status}"></span>
            </strong>
        </p>
    </div>
</main>

<div th:replace="~{layout :: footer}"></div>
<script th:src="@{/js/main.v2.js}"></script>
</body>
</html>
