spring.application.name=phukienrom

# Active profile: set APP_PROFILE=prod khi deploy lên Railway/server
spring.profiles.active=${APP_PROFILE:dev}

# ── Datasource (loaded per profile) ──
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000

# ── JPA ──
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# Batch fetching giảm N+1
spring.jpa.properties.hibernate.default_batch_fetch_size=20
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true

# ── JWT (MUST be set via env var — never hardcode) ──
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ── Cloudinary (MUST be set via env var) ──
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ── Upload ──
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── Thymeleaf ──
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ── HTTP static cache ──
spring.web.resources.cache.period=604800
spring.web.resources.cache.cachecontrol.max-age=604800
spring.web.resources.cache.cachecontrol.cache-public=true

# ── Server ──
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-stacktrace=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# ── Logging ──
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# ── Business config ──
app.order.cancel-window-hours=${ORDER_CANCEL_WINDOW_HOURS:24}
app.product.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}