# ═══════════════════════════════════════════════════════════
# PROD PROFILE — dùng khi deploy (Railway, Render, VPS)
# TẤT CẢ credentials phải đến từ environment variables
# File này an toàn để commit vì không chứa giá trị thật
# ═══════════════════════════════════════════════════════════

# Thymeleaf cache ON trong prod
spring.thymeleaf.cache=true

# JPA — không show SQL trong prod
spring.jpa.show-sql=false

# Logging minimal trong prod
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Yêu cầu các env vars sau được set trên Railway/server:
#   DATABASE_URL         = jdbc:postgresql://host:port/dbname
#   DB_PASSWORD          = <db password>
#   JWT_SECRET           = <random 64+ char string>
#   CLOUDINARY_CLOUD_NAME= <cloud name>
#   CLOUDINARY_API_KEY   = <api key>
#   CLOUDINARY_API_SECRET= <api secret>
